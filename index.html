<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Task Manager Dashboard</h1>

    <!-- Add task row -->
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Enter a new task...">
      <button id="addBtn" onclick="addTask()">Add Task</button>
    </div>

    <!-- Search + filter row -->
    <div class="controls-row">
      <input type="text" id="searchBox" placeholder="🔍 Search tasks..." onkeyup="renderTasks()">
      <select id="filterSelect" onchange="renderTasks()">
        <option value="all">All Tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Task list -->
    <ul id="taskList"></ul>

    <!-- Empty state -->
    <p id="emptyState" class="empty-state" style="display:none;">No tasks found. Add one above 👆</p>
  </div>

<script src="script.js"></script>
</body>
</html>
